name: DAST Baseline

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    env:
      POSTGRES_DB: immigration_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PORT: 5000
      CLIENT_URL: http://127.0.0.1
      BASE_URL: http://127.0.0.1/api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/immigration_ci
      CHROMIUM_PATH: /usr/bin/chromium
      AUTH_TOKEN_SECRET: ci-auth-token-secret-with-at-least-32-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-admin-password
      ADMIN_NAME: CI Administrator
      VITE_API_URL: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1/api/health >/dev/null; then
              echo "Stack is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Stack failed to become healthy"
          docker compose logs
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1"
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Stop stack
        if: always()
        run: docker compose down -v
