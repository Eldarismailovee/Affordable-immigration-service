name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: immigration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d immigration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/immigration_ci
      CLIENT_URL: http://127.0.0.1:5173
      BASE_URL: http://127.0.0.1:5000
      AUTH_TOKEN_SECRET: ci-auth-token-secret-with-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Apply migrations on CI database
        run: npm run migrate

      - name: Check migration state
        run: npm run migrate:check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    env:
      POSTGRES_DB: immigration_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PORT: 5000
      CLIENT_URL: http://127.0.0.1
      BASE_URL: http://127.0.0.1/api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/immigration_ci
      CHROMIUM_PATH: /usr/bin/chromium
      AUTH_TOKEN_SECRET: ci-auth-token-secret-with-at-least-32-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-admin-password
      ADMIN_NAME: CI Administrator
      VITE_API_URL: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull -t immigration-backend:ci ./backend

      - name: Build frontend image
        run: docker build --pull --build-arg VITE_API_URL=/api -t immigration-frontend:ci ./frontend

      - name: Validate compose file
        run: docker compose config --quiet
