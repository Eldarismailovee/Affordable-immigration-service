server {
  listen 80;
  server_name _;

  # Docker embedded DNS — re-resolve upstreams when containers are recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # TODO: When TLS terminates here or at upstream LB, enable HSTS for production:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 10M;

  location /api/ {
    set $upstream_backend backend;
    proxy_pass http://$upstream_backend:5000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $upstream_backend backend;
    proxy_pass http://$upstream_backend:5000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_frontend frontend;
    proxy_pass http://$upstream_frontend:80;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
